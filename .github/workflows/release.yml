name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build All Release APKs
        run: ./gradlew assembleArm64Release assembleArm32Release assembleUniversalRelease --no-daemon

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/arm64/release/app-arm64-release.apk release-apks/ || true
          cp app/build/outputs/apk/arm32/release/app-arm32-release.apk release-apks/ || true
          cp app/build/outputs/apk/universal/release/app-universal-release.apk release-apks/ || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-apks/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
